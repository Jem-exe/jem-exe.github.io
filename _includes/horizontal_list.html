<ul class="horizontal-list">
  {% for item in include.collection %}
    <li>
      <a href="{{ item.url }}">
        <img src="../assets/Button.png" width = "100px" height = "50px" alt="Button" display ="block">
        <span style="position: relative; display: inline-block">{{ item.title }}</span>
      </a> 
      &nbsp;&nbsp;
    </li>
  {% endfor %}
</ul>
